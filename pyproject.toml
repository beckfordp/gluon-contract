# SPDX-License-Identifier: MIT

[project]
name = "gluon-contract"
version = "0.1.0"
description = "Black-box wire-contract harness for Gluon services (gluon ADR 0028)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema==4.26.0",
    "kafka-python==3.0.12",
    "opentelemetry-proto==1.45.2",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.7",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
]

[dependency-groups]
# Pinned exactly: bump deliberately (conductor/tech-stack.md).
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "types-jsonschema==4.26.0.20261006",
    "types-protobuf==7.35.1.20260906",
    "types-pyyaml==6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Unit tests only. The contract checks under checks/ need Docker or a cluster
# and are always run by path, never by a bare `pytest` or in CI.
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "-p", "pytester"]
markers = [
    "cluster: also runs in cluster mode, against CONTRACT_BASE_URL (RUST-5.4)",
    "isolated: needs isolated mode, even in a module marked cluster",
]

[tool.coverage.run]
source = ["gluon_contract"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# kafka-python ships no type information (RUST-1.8).
module = ["kafka", "kafka.*"]
ignore_missing_imports = true
